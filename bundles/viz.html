<html lang="en">
<head>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px; color: #0f172a; background: #f8fafc;
  display: flex; flex-direction: column; height: 100vh;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: #fff;
  border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px; padding: 5px 8px;
  border: 1px solid #cbd5e1; border-radius: 4px; background: #fff;
}
.controls input { width: 200px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }
main { display: flex; flex: 1; min-height: 0; }
#graph {
  flex: 1 1 60%; background: #fff;
  border-right: 1px solid #e2e8f0; min-width: 0;
}
#detail { flex: 0 0 40%; overflow-y: auto; padding: 18px 22px; background: #fff; }
#detail-empty { text-align: center; margin-top: 40px; color: #64748b; }
.detail-header { margin-bottom: 12px; }
.detail-header h1 { font-size: 18px; margin: 4px 0 2px; font-weight: 600; }
.type-chip {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; color: #fff; background: #94a3b8;
  text-transform: uppercase; letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid; grid-template-columns: 90px 1fr;
  row-gap: 4px; column-gap: 12px; margin: 8px 0 12px; font-size: 13px;
}
dl.frontmatter dt { color: #64748b; font-weight: 500; }
dl.frontmatter dd { margin: 0; word-break: break-all; }
.tag {
  display: inline-block; background: #f1f5f9; border: 1px solid #e2e8f0;
  border-radius: 4px; padding: 1px 6px; font-size: 11px; margin: 1px 2px 1px 0;
}
a.external { color: #3b82f6; word-break: break-all; }
.markdown-body { font-size: 13px; line-height: 1.6; }
.markdown-body h1 { font-size: 16px; margin: 16px 0 8px; }
.markdown-body h2 { font-size: 14px; margin: 14px 0 6px; }
.markdown-body h3 { font-size: 13px; margin: 12px 0 4px; }
.markdown-body code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.markdown-body pre { background: #f1f5f9; padding: 10px; border-radius: 4px; overflow-x: auto; }
.markdown-body pre code { background: none; padding: 0; }
.markdown-body table { border-collapse: collapse; width: 100%; font-size: 12px; }
.markdown-body th, .markdown-body td { border: 1px solid #e2e8f0; padding: 4px 8px; text-align: left; }
.markdown-body th { background: #f8fafc; }
.markdown-body blockquote { border-left: 3px solid #cbd5e1; margin: 0; padding: 4px 12px; color: #64748b; }
#detail-backlinks { margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
#detail-backlinks h3 { font-size: 13px; margin: 0 0 6px; }
#backlinks-list { margin: 0; padding-left: 16px; }
#backlinks-list li { margin: 3px 0; }
#backlinks-list a { color: #3b82f6; cursor: pointer; text-decoration: none; }
#backlinks-list a:hover { text-decoration: underline; }
.dim { opacity: 0.15; }
</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF Bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search…">
    <select id="filter-type"><option value="">All types</option></select>
    <select id="layout">
      <option value="cose">Force</option>
      <option value="concentric">Concentric</option>
      <option value="breadthfirst">Tree</option>
      <option value="circle">Circle</option>
      <option value="grid">Grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>
<main>
  <div id="graph"></div>
  <div id="detail">
    <div id="detail-empty"><p>Click a node to explore.</p></div>
    <div id="detail-content" hidden>
      <div class="detail-header">

        <h1 id="detail-title"></h1>

        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <div id="detail-body" class="markdown-body"></div>
      <div id="detail-backlinks" hidden>
        <h3>Referenced by</h3>
        <ul id="backlinks-list"></ul>
      </div>
    </div>
  </div>
</main>

rce": "demo-project/open-exchange-rates", "target": "storage/bigquery-common"}}, {"data": {"source": "demo-project/reddit-ads-performance-insights", "target": "storage/databricks-common"}}, {"data": {"source": "demo-project/shopify-orders-2026", "target": "storage/bigquery-common"}}, {"data": {"source": "demo-project/linkedin-ads-performance-insights", "target": "storage/bigquery-common"}}, {"data": {"source": "demo-project/tiktok-ads-insights", "target": "storage/bigquery-common"}}, {"data": {"source": "demo-project/db-google-ads-ads-stats", "target": "storage/databricks-common"}}, {"data": {"source": "demo-project/google-ads-ad-group-stats-bq", "target": "storage/bigquery-common"}}, {"data": {"source": "demo-project/facebook-ads-insights", "target": "storage/bigquery-common"}}, {"data": {"source": "demo-project/facebook-ads-insights", "target": "storage/snowflake-marketing"}}], "bodies": {"demo-project/purchases-list": "---\ntype: \"OWOX Data Mart\"\ntitle: \"Purchases List\"\ndescription: \"This dataset contains detailed transaction records at the line-item level, including product quantities, pricing, and profitability metrics. It is primarily used to analyze sales performance, calcu...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/d57170ef-8de5-4475-bbfb-61b20a72b051.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-15T12:47:41.000Z\n---\n\n# Purchases List\n\nThis dataset contains detailed transaction records at the line-item level, including product quantities, pricing, and profitability metrics. It is primarily used to analyze sales performance, calculate margins, and track net revenue after adjustments.\n\n## Overview\n\n- **ID:** `d57170ef-8de5-4475-bbfb-61b20a72b051`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/d57170ef-8de5-4475-bbfb-61b20a72b051.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `purchase_id` | STRING | Unique identifier for each individual item line within a transaction. |\n| `order_id` | STRING | Unique identifier for the overall customer order or transaction. |\n| `product_id` | INTEGER | Unique numeric identifier for the specific product purchased. |\n| `quantity` | INTEGER | The number of units of the product included in the purchase line. |\n| `sale_price` | FLOAT | The price at which a single unit of the product was sold. |\n| `currency` | STRING | The three-letter ISO code representing the currency used for the transaction. |\n| `unit_cost` | FLOAT | The cost to the business for a single unit of the product. |\n| `line_revenue` | FLOAT | Total gross revenue for the line item, calculated as quantity multiplied by sale price. |\n| `line_cost` | FLOAT | Total cost for the line item, calculated as quantity multiplied by unit cost. |\n| `line_net_revenue` | FLOAT | The revenue for the line item after accounting for returns or adjustments. |\n| `line_net_profit` | FLOAT | The total profit generated by the line item after subtracting costs from net revenue. |\n", "storage/bigquery-common": "", "demo-project/growth-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥇 Growth (E-Commerce)\"\ndescription: \"Demo guide\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/b4f59656-d52e-4ae3-847e-c34c025956bf.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"sql\"]\ntimestamp: 2026-06-09T13:01:14.000Z\n---\n\n# 🥇 Growth (E-Commerce)\n\nDemo guide\n  \n  ▎ What it is. A gold-layer Data Mart built the OWOX way: a thin SQL base that pulls one row per web \n  ▎ session, enriched entirely through Joinable Data Marts — zero join SQL. Five governed marts are \n  ▎ attached: Traffic Sources, Countries, Customers, Orders, and Purchases (Purchases reached \n  ▎ transitively: session → order → line item).\n  ▎\n  ▎ Headline message. \"This is how you build a star-schema gold layer in OWOX without writing join SQL. \n  ▎ The base reads raw sessions; every other dimension and metric is composed by joining governed Data \n  ▎ Marts and picking an aggregation. OWOX rolls the 1-to-many order lines back up to the session grain \n  ▎ automatically — nothing fans out, and the join logic stays reusable instead of buried in one giant \n  ▎ query.\"\n  ▎\n  ▎ Demo cases it supports:\n  ▎ - Full funnel in one mart — traffic (source / medium / campaign, paid vs organic, channel grouping) → \n  ▎ session → conversion → order → revenue. Show conversion rate by channel.\n  ▎ - Acquisition & geo growth — revenue and conversions sliced by channel grouping and country/region; \n  ▎ spot the markets and channels driving growth.\n  ▎ - Customer quality — Platinum / Gold / Standard segments against revenue and conversion: is high-value\n  ▎  demand growing?\n  ▎ - Transitive-join showcase — Purchases joins through Orders (session → order → item): multi-hop joins \n  ▎ with SUM roll-up to the session grain.\n  ▎ - Governance — some upstream marts are marked hidden from reporting to keep the analyst's field picker\n  ▎  clean; show how you curate the catalog.\n  ▎ - Self-serve in Sheets — the same mart powers a live, refreshable Google Sheets report via the OWOX \n  ▎ extension.\n  ▎\n  ▎ Metrics (after the revenue push-down): sessions, conversion rate, orders, units, gross revenue, net \n  ▎ (Completed-only) revenue, gross profit, AOV — by date/month, channel, country, segment, device.\n  ▎\n  ▎ Presenter caveat: product/SKU/category breakdowns are intentionally out of scope here (session grain).\n  ▎  For item-level analysis, use a purchases-grain mart.\n\n## Overview\n\n- **ID:** `b4f59656-d52e-4ae3-847e-c34c025956bf`\n- **Status:** PUBLISHED\n- **Definition type:** SQL\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/b4f59656-d52e-4ae3-847e-c34c025956bf.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `date` | DATE | The calendar date when the session occurred. |\n| `session_id` | STRING | Unique identifier for an individual web or app session. |\n| `visitor_id` | STRING | Unique identifier for the anonymous visitor or browser. |\n| `traffic_source_id` | INTEGER | Numeric identifier for the marketing channel or referral source that directed the user. |\n| `country_id` | INTEGER | Numeric identifier representing the geographic country of the visitor. |\n| `customer_id` | INTEGER | Unique identifier for a registered user, which is null for guest visitors. |\n| `device_category` | STRING | The type of hardware used by the visitor, such as mobile or desktop. |\n| `is_conversion` | BOOLEAN | Indicates whether the session resulted in a successful transaction or goal completion. |\n", "demo-project/countries-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Countries (E-Commerce)\"\ndescription: \"OWOX data mart '🥈 Countries (E-Commerce)'.\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/bad7e127-2352-4663-8b68-cbd06a9c0eb7.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-04T19:16:51.000Z\n---\n\n# 🥈 Countries (E-Commerce)\n\n## Overview\n\n- **ID:** `bad7e127-2352-4663-8b68-cbd06a9c0eb7`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/bad7e127-2352-4663-8b68-cbd06a9c0eb7.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `country_id` | INTEGER | Unique internal identifier for each country record. |\n| `country` | STRING | Full name of the country. |\n| `country_code` | STRING | Two-letter ISO country code representing the nation. |\n| `weight` | INTEGER | Numerical value used to prioritize or rank countries in the e-commerce system. |\n", "demo-project/pageviews-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Pageviews (E-Commerce)\"\ndescription: \"OWOX data mart '🥈 Pageviews (E-Commerce)'.\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/ebcc639a-e474-418a-8f62-36e222c61e2e.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-05-26T20:00:22.000Z\n---\n\n# 🥈 Pageviews (E-Commerce)\n\n## Overview\n\n- **ID:** `ebcc639a-e474-418a-8f62-36e222c61e2e`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/ebcc639a-e474-418a-8f62-36e222c61e2e.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `date` | DATE | The calendar date when the pageview occurred. |\n| `session_id` | STRING | Unique identifier for a specific user browsing session. |\n| `visitor_id` | STRING | Unique identifier for an individual user or browser. |\n| `hit_number` | INTEGER | The sequential order of the pageview within a specific session. |\n| `page_id` | INTEGER | Unique identifier for the specific page viewed by the visitor. |\n| `hit_timestamp` | TIMESTAMP | The exact date and time when the pageview was recorded, in UTC. |\n", "demo-project/pages-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Pages (E-Commerce)\"\ndescription: \"This dataset provides a comprehensive directory of all web pages within the e-commerce platform, categorized by their functional purpose. It is used to map specific URL paths to human-readable titl...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/5a7b5950-330c-4833-add0-033097440fe7.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-05T09:13:22.000Z\n---\n\n# 🥈 Pages (E-Commerce)\n\nThis dataset provides a comprehensive directory of all web pages within the e-commerce platform, categorized by their functional purpose. It is used to map specific URL paths to human-readable titles and page types, such as Product, Category, or Checkout, to support website navigation and conversion analysis.\n\n## Overview\n\n- **ID:** `5a7b5950-330c-4833-add0-033097440fe7`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/5a7b5950-330c-4833-add0-033097440fe7.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `page_id` | INTEGER | Unique numerical identifier for each specific page on the website. |\n| `page_path` | STRING | The URL path of the page relative to the domain root. |\n| `page_title` | STRING | The human-readable name or display title of the web page. |\n| `page_type` | STRING | Functional category of the page, such as Product, Category, or Checkout. |\n", "demo-project/visitors-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Visitors (E-Commerce)\"\ndescription: \"This dataset provides a comprehensive overview of website visitor behavior and acquisition history at the individual visitor level. It tracks engagement metrics like total sessions and visit dates ...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/13e040df-a062-4f38-803b-54a7e0b75a3e.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-05T19:26:56.000Z\n---\n\n# 🥈 Visitors (E-Commerce)\n\nThis dataset provides a comprehensive overview of website visitor behavior and acquisition history at the individual visitor level. It tracks engagement metrics like total sessions and visit dates alongside marketing attribution details to help analyze user retention and campaign effectiveness.\n\n## Overview\n\n- **ID:** `13e040df-a062-4f38-803b-54a7e0b75a3e`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/13e040df-a062-4f38-803b-54a7e0b75a3e.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `visitor_id` | STRING | Unique identifier for the website visitor. |\n| `linked_customer_id` | INTEGER | Identifier of the registered customer account associated with this visitor, if applicable. |\n| `first_seen_date` | DATE | The date when the visitor first interacted with the website. |\n| `last_seen_date` | DATE | The date of the most recent recorded interaction from this visitor. |\n| `total_sessions` | INTEGER | Total number of distinct browsing sessions initiated by the visitor. |\n| `acquisition_source` | STRING | The specific platform or site that referred the visitor to the website. |\n| `acquisition_medium` | STRING | The high-level channel type used to acquire the visitor, such as organic or paid search. |\n| `acquisition_campaign` | STRING | The name of the marketing campaign that originally brought the visitor to the site. |\n| `cohort_month` | DATE | The month and year of the visitor's first visit, used for retention analysis. |\n| `visitor_segment` | STRING | Classification of the visitor based on their engagement behavior or frequency. |\n| `country_id` | INTEGER | Numeric identifier representing the country where the visitor is located. |\n", "demo-project/product-category-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Product Category (E-Commerce)\"\ndescription: \"This Data Mart provides a comprehensive list of product categories, their management hierarchy, and financial performance targets. It is used to analyze category-level organizational structure and ...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/f33bb078-1183-4951-8b8b-8010f7c91d3f.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-05-26T20:02:01.000Z\n---\n\n# 🥈 Product Category (E-Commerce)\n\nThis Data Mart provides a comprehensive list of product categories, their management hierarchy, and financial performance targets. It is used to analyze category-level organizational structure and monitor target profit margins across different business groups.\n\n## Overview\n\n- **ID:** `f33bb078-1183-4951-8b8b-8010f7c91d3f`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/f33bb078-1183-4951-8b8b-8010f7c91d3f.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `category_id` | INTEGER | Unique numerical identifier for each product category. |\n| `category_name` | STRING | The descriptive name of the product category used for reporting and classification. |\n| `category_manager` | STRING | Full name of the individual responsible for managing the specific product category. |\n| `target_margin` | FLOAT | The desired profit margin percentage set for the category. |\n| `category_group` | STRING | High-level classification used to group related categories together, such as hard or soft goods. |\n", "demo-project/traffic-sources-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Traffic Sources (E-Commerce)\"\ndescription: \"This Data Mart provides a comprehensive breakdown of website traffic origins, categorizing visitors by source, medium, and specific marketing campaigns. It is used to analyze the effectiveness of d...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/61b3c045-b334-440d-9913-bf52bc622af4.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-05T15:34:00.000Z\n---\n\n# 🥈 Traffic Sources (E-Commerce)\n\nThis Data Mart provides a comprehensive breakdown of website traffic origins, categorizing visitors by source, medium, and specific marketing campaigns. It is used to analyze the effectiveness of different acquisition channels and distinguish between paid and organic traffic performance.\n\n## Overview\n\n- **ID:** `61b3c045-b334-440d-9913-bf52bc622af4`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/61b3c045-b334-440d-9913-bf52bc622af4.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `traffic_source_id` | INTEGER | Unique internal identifier for a specific combination of traffic source, medium, and campaign. |\n| `source` | STRING | The origin of the website traffic, such as a search engine, social network, or domain. |\n| `medium` | STRING | The high-level category of the traffic source, such as organic, cost-per-click, or referral. |\n| `campaign` | STRING | The specific marketing campaign name associated with the traffic. |\n| `is_paid` | BOOLEAN | Indicates whether the traffic was generated through a paid marketing channel. |\n| `channel_grouping` | STRING | The classification of traffic into broad categories like Paid Marketing, Direct, or Organic. |\n", "demo-project/product-performance-with-sparklines": "---\ntype: \"OWOX Data Mart\"\ntitle: \"📊 Product Performance with sparklines\"\ndescription: \"OWOX data mart '📊 Product Performance with sparklines'.\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/aba99dcb-f68c-4109-893b-5e795bc53255.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"sql\"]\ntimestamp: 2026-06-01T14:45:59.000Z\n---\n\n# 📊 Product Performance with sparklines\n\n## Overview\n\n- **ID:** `aba99dcb-f68c-4109-893b-5e795bc53255`\n- **Status:** PUBLISHED\n- **Definition type:** SQL\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/aba99dcb-f68c-4109-893b-5e795bc53255.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `Product` | STRING |  |\n| `Brand` | STRING |  |\n| `Category` | STRING |  |\n| `Views By Medium` | STRING |  |\n| `Views Last 30d` | INTEGER |  |\n| `Views Trend` | STRING |  |\n| `Adds to Cart Last 30d` | INTEGER |  |\n| `Adds To Cart Trend` | STRING |  |\n| `Purchases Last 30d` | INTEGER |  |\n| `Purchases Trend` | STRING |  |\n", "demo-project/purchases-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Purchases (E-Commerce)\"\ndescription: \"Describes typical Purchases Data Mart in e-commerce domain for demo puprposes.\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/0212efac-2c7d-4bcb-aaf2-055229de4b75.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-15T16:01:26.000Z\n---\n\n# 🥈 Purchases (E-Commerce)\n\nDescribes typical Purchases Data Mart in e-commerce domain for demo puprposes.\n\nThis Data Mart acts as the foundational layer for understanding purchasing behavior and sales performance. By breaking down transactions into specific line items, it enables the business to move beyond simple revenue tracking and dive deep into SKU-level analytics. Whether you are analyzing sales trends by currency or evaluating the quantity of specific products sold, this data provides the necessary precision for informed decision-making.\n\nThe schema is built for flexibility and scalability, supporting multi-currency transactions and varying product quantities per order. It provides a clean, standardized output that allows analysts to quickly generate insights into which products drive growth and how pricing strategies impact customer purchasing habits at the point of sale.\n\n## Overview\n\n- **ID:** `0212efac-2c7d-4bcb-aaf2-055229de4b75`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/0212efac-2c7d-4bcb-aaf2-055229de4b75.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `purchase_id` | STRING | A unique identifier for each individual item row within an order |\n| `order_id` | STRING | The unique identifier of the transaction. Used to join with the Orders Data Mart. |\n| `product_id` | INTEGER | The unique identifier of the purchased product |\n| `quantity` | INTEGER | The number of units of this specific product included in the purchase line |\n| `sale_price` | FLOAT | The price per unit at the moment of purchase |\n| `currency` | STRING | The currency used for the transaction (e.g., USD) |\n| `unit_cost` | FLOAT | The cost incurred by the business to acquire or produce a single unit of the product. |\n| `line_revenue` | FLOAT | Gross revenue for this order line = Item Sale Price × Quantity. Sum across lines for total gross revenue (all order statuses). |\n| `line_cost` | FLOAT | Cost of goods sold for this order line = Unit Cost × Quantity. Sum for total COGS. |\n| `line_net_revenue` | FLOAT | Revenue recognised only for Completed orders (Cancelled / Returned = 0). Sum for net  revenue. |\n| `line_net_profit` | FLOAT | Profit for Completed orders = (Item Sale Price − Unit Cost) × Quantity, else 0. Sum for  total net profit. |\n", "demo-project/unified-ad-spend-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Unified Ad Spend (E-Commerce)\"\ndescription: \"This dataset provides a consolidated view of daily advertising expenditures and performance metrics across multiple marketing platforms. It allows users to analyze spend, clicks, and impressions at...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/c36e7a4e-e6c0-49ca-99f2-d8440d475363.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"sql\"]\ntimestamp: 2026-06-15T12:39:26.000Z\n---\n\n# 🥈 Unified Ad Spend (E-Commerce)\n\nThis dataset provides a consolidated view of daily advertising expenditures and performance metrics across multiple marketing platforms. It allows users to analyze spend, clicks, and impressions at the campaign level to evaluate cross-channel marketing efficiency.\n\n## Overview\n\n- **ID:** `c36e7a4e-e6c0-49ca-99f2-d8440d475363`\n- **Status:** PUBLISHED\n- **Definition type:** SQL\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/c36e7a4e-e6c0-49ca-99f2-d8440d475363.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `date` | DATE | The calendar date when the advertising activity occurred. |\n| `source` | STRING | The name of the advertising platform or network where the traffic originated. |\n| `medium` | STRING | The marketing channel or payment model used, such as cost-per-click. |\n| `campaign` | STRING | The specific marketing campaign name associated with the ad spend. |\n| `spend` | FLOAT | The total cost of advertising incurred during the specified period. |\n| `clicks` | INTEGER | The total number of times users clicked on the advertisements. |\n| `impressions` | INTEGER | The total number of times the advertisements were displayed to users. |\n", "demo-project/sessions-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Sessions (E-Commerce)\"\ndescription: \"This Data Mart provides a detailed log of individual e-commerce browsing sessions, including traffic sources, device types, and conversion outcomes. It is primarily used to analyze user behavior, m...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/22a66e81-1ce3-4c0a-8ead-3a154df490ab.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-05T16:59:39.000Z\n---\n\n# 🥈 Sessions (E-Commerce)\n\nThis Data Mart provides a detailed log of individual e-commerce browsing sessions, including traffic sources, device types, and conversion outcomes. It is primarily used to analyze user behavior, marketing attribution, and website performance across different geographic regions.\n\n## Overview\n\n- **ID:** `22a66e81-1ce3-4c0a-8ead-3a154df490ab`\n- **Status:** PUBLISHED\n- **Definition type:** VIEW\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/22a66e81-1ce3-4c0a-8ead-3a154df490ab.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `date` | DATE | The specific date when the browsing session occurred |\n| `session_id` | STRING | Unique identifier for an individual user session |\n| `customer_id` | INTEGER | Unique identifier of the customer associated with the session |\n| `device_category` | STRING | The type of hardware device used during the session (e.g., mobile, desktop) |\n| `conversion_seed` | FLOAT | A technical value used to simulate the probability of a transaction. |\n| `visitor_id` | STRING | Unique identifier for the anonymous or recognized visitor. |\n| `traffic_source_id` | INTEGER | Internal numeric identifier for the marketing traffic source. |\n| `country_id` | INTEGER | Numeric identifier representing the geographic country of the visitor. |\n| `is_conversion` | BOOLEAN | Indicates whether the session resulted in a successful transaction or goal completion. |\n| `source` | STRING | The origin of the traffic, such as Google, Facebook, or direct entry. |\n| `medium` | STRING | The high-level channel type of the traffic, such as organic or cost-per-click. |\n| `campaign` | STRING | The name of the specific marketing campaign that drove the session. |\n", "demo-project/products-e-commerce": "---\ntype: \"OWOX Data Mart\"\ntitle: \"🥈 Products (E-Commerce)\"\ndescription: \"This Data Mart provides a comprehensive catalog of e-commerce products, including pricing, cost structures, and website categorization. It is primarily used for analyzing product margins and managi...\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/f6b33805-84ed-4469-9f7d-438e99c48696.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"view\"]\ntimestamp: 2026-06-16T07:00:41.000Z\n---\n\n# 🥈 Products (E-Commerce)\n\nThis Data Mart provides a comprehensive catalog of e-commerce products, including pricing, cost structures, umber of times an ad has been displayed on search results pages. |\n| `Clicks` | INTEGER | Clicks are what you pay for. |\n| `Ctr` | FLOAT | The click-through rate (CTR) is the number of times an ad was clicked, divided by the number of times the ad was shown. |\n| `Spend` | FLOAT | The cost per click (CPC) summed for each click. |\n| `Conversions` | INTEGER | The number of conversions. |\n| `AdStatus` | STRING | The ad status. |\n| `CampaignStatus` | STRING | The campaign status. |\n| `FinalUrl` | STRING | The Final URL of the ad. |\n| `VideoViews` | INTEGER | The number of times the video was played and watched for at least two continuous seconds with more than 50% of the screen in view. |\n| `VideoCompletionRate` | INTEGER | The number of completed video views divided by the total number of impressions, multiplied by 100. |\n| `BusinessName` | STRING | Depending on your responsive ad's placement, your business's name may appear in your ad. |\n| `Revenue` | STRING | The revenue optionally reported by the advertiser as a result of conversions. |\n| `CostPerConversion` | FLOAT | The cost per conversion. |\n| `AdType` | STRING | The ad type. |\n| `AdGroupName` | STRING | The ad group name. |\n", "demo-project/google-ads-ad-group-stats-a": "---\ntype: \"OWOX Data Mart\"\ntitle: \"Google Ads Ad Group Stats [A]\"\ndescription: \"OWOX data mart 'Google Ads Ad Group Stats [A]'.\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/16e026de-f69e-4453-8c8d-a4d6f4bfe2d2.ndjson\"\ntags: [\"owox\", \"aws_athena\", \"connector\"]\ntimestamp: 2026-04-14T10:41:14.361Z\n---\n\n# Google Ads Ad Group Stats [A]\n\n## Overview\n\n- **ID:** `16e026de-f69e-4453-8c8d-a4d6f4bfe2d2`\n- **Status:** PUBLISHED\n- **Definition type:** CONNECTOR\n- **Storage:** AWS Athena [Marketing] (AWS_ATHENA)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/16e026de-f69e-4453-8c8d-a4d6f4bfe2d2.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------| arts/48537173-e031-4349-b42c-696a1dcd72e2.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"connector\"]\ntimestamp: 2026-06-16T10:01:08.000Z\n---\n\n# Shopify Orders 2026\n\n## Overview\n\n- **ID:** `48537173-e031-4349-b42c-696a1dcd72e2`\n- **Status:** PUBLISHED\n- **Definition type:** CONNECTOR\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/48537173-e031-4349-b42c-696a1dcd72e2.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `id` | STRING | A globally-unique ID. |\n| `name` | STRING | The order name, generated by combining the order_number with the shop order prefix. |\n| `email` | STRING | The email address of the customer. |\n| `phone` | STRING | The phone number of the customer. |\n| `confirmed` | BOOLEAN | Whether the order is confirmed. |\n| `closed` | BOOLEAN | Whether the order is closed. |\n| `cancelledAt` | TIMESTAMP | The date and time when the order was cancelled. |\n| `cancelReason` | STRING | The reason for cancellation. |\n| `currencyCode` | STRING | The currency of the order. |\n| `subtotalPrice` | FLOAT | The subtotal price of the order. |\n| `totalPrice` | FLOAT | The total price of the order. |\n| `totalTax` | FLOAT | The total tax of the order. |\n| `totalShippingPrice` | FLOAT | The total shipping price. |\n| `totalDiscounts` | FLOAT | The total discounts applied. |\n| `discountCodes` | STRING | Discount codes applied to the order as JSON array (code, amount, type). |\n| `createdAt` | TIMESTAMP | The date and time when the order was created. |\n", "demo-project/linkedin-ads-performance-insights": "---\ntype: \"OWOX Data Mart\"\ntitle: \"Linkedin Ads Performance Insights\"\ndescription: \"Linkedin Ads Performance Insights with ad-level granularity.\"\nresource: \"https://app.owox.com/api/external/http-data/data-marts/330c308c-157e-46eb-8ba9-2d741fc9f89b.ndjson\"\ntags: [\"owox\", \"google_bigquery\", \"connector\"]\ntimestamp: 2026-05-26T20:08:10.000Z\n---\n\n# Linkedin Ads Performance Insights\n\nLinkedin Ads Performance Insights with ad-level granularity.\n\n## Overview\n\n- **ID:** `330c308c-157e-46eb-8ba9-2d741fc9f89b`\n- **Status:** PUBLISHED\n- **Definition type:** CONNECTOR\n- **Storage:** BigQuery [Common] (GOOGLE_BIGQUERY)\n- **Data endpoint:** `GET https://app.owox.com/api/external/http-data/data-marts/330c308c-157e-46eb-8ba9-2d741fc9f89b.ndjson`\n\n# Schema\n\n| Column | Type | Description |\n|--------|------|-------------|\n| `dateRangeStart` | DATE | Start date of the report data point. Date is specified in UTC format (YYYY-MM-DD). |\n| `dateRangeEnd` | DATE | End date of the report data point. Date is specified in UTC format (YYYY-MM-DD). |\n| `pivotValues` | STRING | The value of the pivots for a specific record returned. For example, supplying pivots of CREATIVE and CONVERSION results in a list of records, one for each creative/conversion combination. The pivotValues contain serialized URNs for the specific creative and conversion for a record. To resolve these URNs to their corresponding entities, refer to LinkedIn Marketing API URN Resolution. |\n| `actionClicks` | FLOAT | The count of clicks on the action button of the Sponsored Messaging ad. |\n| `adUnitClicks` | FLOAT | The count of clicks on the ad unit displayed alongside the Sponsored Messaging ad. |\n| `cardClicks` | FLOAT | Non-demographic pivots only (i.e. not MEMBER_). The number of clicks for each card of a carousel ad. The first card click of the carousel ad results in an immediate cardClick and click, whereas scrolling to other cards and clicking will count as additional cardClick. |\n| `cardImpressions` | FLOAT | Non-demographic pivots only (i.e. not MEMBER_). The number of impressions shown for each card of a carousel ad. The first card of the carousel ad results in an immediate cardImpression and impression, whereas scrolling to other cards will count as additional cardImpressions. |\n| `clicks` l amount of money you've spent on your campaign, ad set or ad during its schedule. This metric is estimated. |\n", "storage/snowflake-marketing": ""}, "types": ["AWS_ATHENA", "CONNECTOR", "DATABRICKS", "GOOGLE_BIGQUERY", "SNOWFLAKE", "SQL", "VIEW"]};

<script>
(function () {
  const bundle = window.BUNDLE;
  document.title = window.BUNDLE_NAME + " — OKF Viewer";
  document.getElementById("bundle-name").textContent = window.BUNDLE_NAME;

  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] = backlinks[target] || []).push(source);
  }

  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      { selector: "node", style: {
          "background-color": "data(color)", "label": "data(label)",
          "color": "#0f172a", "font-size": 11,
          "text-valign": "bottom", "text-margin-y": 4,
          "text-wrap": "wrap", "text-max-width": 120,
          "width": "data(size)", "height": "data(size)",
          "border-width": 1, "border-color": "#0f172a" } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#f59e0b" } },
      { selector: "edge", style: {
          "width": 1.5, "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1", "target-arrow-shape": "triangle",
          "curve-style": "bezier", "arrow-scale": 0.9 } },
      { selector: "edge:selected", style: {
          "line-color": "#f59e0b", "target-arrow-color": "#f59e0b", "width": 2.5 } },
      { selector: ".dim", style: { "opacity": 0.15 } },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => { if (evt.target === cy) clearSelection(); });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });
  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30); clearSelection();
  });
  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay = (d.label || "").toLowerCase() + " " + d.id.toLowerCase() + " " + (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((e) => {
      e.toggleClass("dim", e.source().hasClass("dim") || e.target().hasClass("dim"));
    });
  });
  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => n.toggleClass("dim", n.data("type") !== t));
    cy.edges().forEach((e) => {
      e.toggleClass("dim", e.source().hasClass("dim") || e.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    document.getElementById("detail-content").hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type; chip.style.background = data.color;
    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource; a.textContent = data.resource;
      a.target = "_blank"; a.rel = "noopener"; a.className = "external";
      resourceEl.appendChild(a);
    } else { resourceEl.textContent = "—"; }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    for (const t of (data.tags || [])) {
      const span = document.createElement("span");
      span.className = "tag"; span.textContent = t; tagsEl.appendChild(span);
    }
    if (!data.tags || !data.tags.length) tagsEl.textContent = "—";

    document.getElementById("detail-body").innerHTML =
      marked.parse(bundle.bodies[conceptId] || "", { breaks: false, gfm: true });

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    blSection.hidden = !bl.length;
    for (const src of bl) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = nodeIndex[src] ? nodeIndex[src].label : src;
      a.onclick = () => showDetail(src);
      li.appendChild(a); blList.appendChild(li);
    }
  }
})();
</script>
